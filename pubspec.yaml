name: ai_chat_stream
description: >-
  Streaming LLM chat for Flutter: one interface for OpenAI, Claude and Gemini,
  a headless controller, and two UIs: a full-screen view and a floating
  chat bubble.
version: 0.1.0
repository: https://github.com/pandeykushal/ai_chat_stream
issue_tracker: https://github.com/pandeykushal/ai_chat_stream/issues
homepage: https://github.com/pandeykushal
funding:
  - https://www.buymeacoffee.com/kushalpandey
topics:
  - ai
  - llm
  - chat
  - streaming
  - openai

environment:
  sdk: ">=3.6.0 <4.0.0"
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter
  # the only runtime dependency; pure Dart so it works on every platform
  http: ">=1.1.0 <2.0.0"

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ">=5.0.0 <7.0.0"

flutter:
  uses-material-design: true
